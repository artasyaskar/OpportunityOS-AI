name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Run Type Check
      run: npx tsc --noEmit

    - name: Run Linter
      run: npm run lint

    - name: Build Next.js
      run: npm run build
      env:
        # Provide dummy values so build succeeds without real secrets
        NEXT_PUBLIC_DEMO_MODE: "true"
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: "mock-project"
        NEXT_PUBLIC_FIREBASE_API_KEY: "mock-key"
        GEMINI_API_KEY: "mock-gemini-key"
        GROQ_API_KEY: "mock-groq-key"
        R2_ACCOUNT_ID: "mock-r2"
        R2_ACCESS_KEY_ID: "mock-r2-key"
        R2_SECRET_ACCESS_KEY: "mock-r2-secret"
